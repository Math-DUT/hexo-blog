constructor({ origin, speed, color, angle, context }) {
this.origin = origin
this.position = { ...this.origin }
this.color = color
this.speed = speed
this.angle = angle
this.context = context
this.renderCount = 0
}
draw() {
this.context.fillStyle = this.color
this.context.beginPath()
this.context.arc(this.position.x, this.position.y, 2, 0, Math.PI * 2)
this.context.fill()
}
move() {
this.position.x = (Math.sin(this.angle) * this.speed) + this.position.x
this.position.y = (Math.cos(this.angle) * this.speed) + this.position.y + (this.renderCount * 0.3)
this.renderCount++
}
}

class Boom {
constructor({ origin, context, circleCount = 16, area }) {
this.origin = origin
this.context = context
this.circleCount = circleCount
this.area = area
this.stop = false
this.circles = []
}
randomArray(range) {
const length = range.length
const randomIndex = Math.floor(length * Math.random())
return range[randomIndex]
}
randomColor() {
const range = ['8', '9', 'A', 'B', 'C', 'D', 'E', 'F']
return '#' + this.randomArray(range) + this.randomArray(range) + this.randomArray(range) + this.randomArray(range) + this.randomArray(range) + this.randomArray(range)
}
randomRange(start, end) {
return (end - start) * Math.random() + start
}
init() {
for (let i = 0; i < this.circleCount; i++) {
const circle = new Circle({
context: this.context,
origin: this.origin,
color: this.randomColor(),
angle: this.randomRange(Math.PI - 1, Math.PI + 1),
speed: this.randomRange(1, 6)
})
this.circles.push(circle)
}
}
move() {
this.circles.forEach((circle, index) => {
if (circle.position.x > this.area.width || circle.position.y > this.area.height) {
return this.circles.splice(index, 1)
}
circle.move()
})
if (this.circles.length == 0) {
this.stop = true
}
}
draw() {
this.circles.forEach(circle => circle.draw())
}
}

run() {

}

boom.draw()
})

}
}

    /* 控制台区域 */

      background: #000;
      color: var(--accent-orange);
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 16px;
      border: 1px solid #334155;
      min-width: 40px;
      text-align: center;
    }

    canvas, svg { display: block; margin: 0 auto; margin-top: 10px;}
  </style>

<body>

<div class="wli-container">
  <h1 class="header-title">WLI 垂直扫描干涉仿真终端</h1>

  <div class="status-hud" id="summary-text">
    [SYS_READY] 系统已就绪。请调节 Z 轴扫描滑块启动探测。
  </div>

  <div class="main-layout">
    <div class="view-panel">
      <div class="panel-title">🔬 光学机械剖面图 (Z-Scan Mech)</div>
      <svg id="mechSvg" width="420" height="320"></svg>
    </div>

    <div class="view-panel">
      <div class="panel-title">📈 时序干涉信号图 (Interferogram)</div>
      <canvas id="signalCanvas" width="420" height="320"></canvas>
    </div>
  </div>

  <div class="control-dashboard">
    <div class="control-row">
      <div class="control-label">▶ 探测目标锁定：</div>
      <div class="segmented-control">
        <input type="radio" id="ptA" name="pixelSelect" value="A" checked>
        <label for="ptA">🎯 像素点 A (150nm凸起)</label>

        <input type="radio" id="ptB" name="pixelSelect" value="B">
        <label for="ptB">🎯 像素点 B (280nm凹陷)</label>
      </div>
    </div>

    <div class="control-row">
      <div class="control-label">▶ Z轴马达位移：</div>
      <div class="z-slider-container">
        <input type="range" id="zSlider" min="0" max="400" value="0">
        <span style="color:var(--text-muted); font-weight:bold;">Z = <span id="zVal" class="val-disp">0</span> nm</span>
      </div>
    </div>
  </div>
</div>

<script>
  // 物理参数常量
  const targetA_Z = 150;
  const targetB_Z = 280;
  const lambda = 600;
  const coherenceLen = 45;

  // DOM 元素
  const zSlider = document.getElementById('zSlider');
  const zVal = document.getElementById('zVal');
  const mechSvg = document.getElementById('mechSvg');
  const canvas = document.getElementById('signalCanvas');
  const ctx = canvas.getContext('2d');
  const summaryText = document.getElementById('summary-text');

  function getSelectedPoint() {
    return document.querySelector('input[name="pixelSelect"]:checked').value;
  }

  function calcIntensity(z, z0) {
    const deltaZ = z - z0;
    const env = Math.exp(-Math.pow(deltaZ / coherenceLen, 2));
    const carrier = Math.cos((4 * Math.PI * deltaZ) / lambda);
    return 0.5 + 0.45 * env * carrier;
  }

  function drawMech(currentZ) {
    const activePt = getSelectedPoint();
    const targetZ0 = activePt === 'A' ? targetA_Z : targetB_Z;
    const distanceToZ0 = Math.abs(currentZ - targetZ0);

    const currentIntensity = calcIntensity(currentZ, targetZ0);
    const lightColor = `rgba(255, 255, 255, ${currentIntensity})`;
    const beamOpacity = distanceToZ0 < coherenceLen * 2 ? 1 : 0.2;

    mechSvg.innerHTML = `
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#475569" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>
            </defs>

            <rect x="40" y="240" width="150" height="60" fill="#c2410c" rx="2"/>
            <text x="75" y="275" fill="#fff" font-weight="bold" font-size="13">凸起 A</text>

            <rect x="190" y="280" width="170" height="20" fill="#0369a1" rx="2"/>
            <text x="240" y="295" fill="#fff" font-weight="bold" font-size="13">基底 B</text>

            <g transform="translate(0, ${currentZ * 0.3})">
                <rect x="100" y="20" width="200" height="40" fill="url(#lensGrad)" stroke="#64748b" stroke-width="2" rx="4"/>
                <text x="135" y="45" fill="#cbd5e1" font-size="13" font-weight="bold">WLI 光学扫描镜头</text>
                <line x1="120" y1="65" x2="280" y2="65" stroke="#10b981" stroke-width="3"/>
                <text x="290" y="70" fill="#10b981" font-size="11">内部参考面</text>
            </g>

            <g stroke="#f87171" stroke-width="2" opacity="${beamOpacity}" filter="url(#glow)">
                <line x1="130" y1="${65 + currentZ*0.3}" x2="130" y2="240" stroke-dasharray="6,3"/>
                <line x1="260" y1="${65 + currentZ*0.3}" x2="260" y2="280" stroke-dasharray="6,3"/>
            </g>

            <circle cx="${activePt === 'A' ? 130 : 260}" cy="${activePt === 'A' ? 240 : 280}" r="8" fill="none" stroke="#fb923c" stroke-width="2"/>
            <line x1="${activePt === 'A' ? 120 : 250}" y1="${activePt === 'A' ? 240 : 280}" x2="${activePt === 'A' ? 140 : 270}" y2="${activePt === 'A' ? 240 : 280}" stroke="#fb923c"/>
            <line x1="${activePt === 'A' ? 130 : 260}" y1="${activePt === 'A' ? 230 : 270}" x2="${activePt === 'A' ? 130 : 260}" y2="${activePt === 'A' ? 250 : 290}" stroke="#fb923c"/>

            <g transform="translate(320, 10)">
                <rect x="0" y="0" width="90" height="90" fill="#000" stroke="#334155" stroke-width="3" rx="6"/>
                <circle cx="45" cy="45" r="30" fill="${lightColor}" filter="url(#glow)"/>
                <text x="10" y="110" fill="#94a3b8" font-size="12">CCD 实时捕捉</text>
            </g>
        `;
  }

  function drawSignal(currentZ) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const activePt = getSelectedPoint();
    const targetZ0 = activePt === 'A' ? targetA_Z : targetB_Z;

    // 绘制暗网格背景
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for(let i = 40; i < W; i += 30) { ctx.beginPath(); ctx.moveTo(i, 10); ctx.lineTo(i, H - 30); ctx.stroke(); }
    for(let i = 10; i < H - 30; i += 30) { ctx.beginPath(); ctx.moveTo(40, i); ctx.lineTo(W - 10, i); ctx.stroke(); }

    // 坐标轴
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(40, 10); ctx.lineTo(40, H - 30); // Y
    ctx.lineTo(W - 10, H - 30); // X
    ctx.stroke();

    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px sans-serif';
    ctx.fillText('光强 I', 10, 20);
    ctx.fillText('马达扫描位置 Z (nm)', W - 130, H - 10);

    function getCanvasX(z_nm) { return 40 + (z_nm / 400) * (W - 60); }
    function getCanvasY(intensity) { return (H - 30) - intensity * (H - 60); }

    // 绘制干涉波形 (带发光)
    ctx.shadowBlur = 8;
    ctx.shadowColor = activePt === 'A' ? '#fb923c' : '#38bdf8';
    ctx.strokeStyle = activePt === 'A' ? '#fb923c' : '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    for (let z = 0; z <= 400; z += 1) {
      const y_val = calcIntensity(z, targetZ0);
      const cx = getCanvasX(z);
      const cy = getCanvasY(y_val);
      if (z === 0) ctx.moveTo(cx, cy);
      else ctx.lineTo(cx, cy);
    }
    ctx.stroke();
    ctx.shadowBlur = 0; // 重置阴影

    // 包络虚线
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    for (let z = 0; z <= 400; z += 2) {
      const env = Math.exp(-Math.pow((z - targetZ0) / coherenceLen, 2));
      const cy = getCanvasY(0.5 + 0.45 * env);
      if (z === 0) ctx.moveTo(getCanvasX(z), cy); else ctx.lineTo(getCanvasX(z), cy);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // 扫描红线
    const curCx = getCanvasX(currentZ);
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ef4444';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(curCx, 10);
    ctx.lineTo(curCx, H - 30);
    ctx.stroke();

    // 焦点发光球
    const curIntensity = calcIntensity(currentZ, targetZ0);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(curCx, getCanvasY(curIntensity), 6, 0, 2 * Math.PI);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function updateText(currentZ) {
    const activePt = getSelectedPoint();
    const targetZ = activePt === 'A' ? targetA_Z : targetB_Z;
    const diff = Math.abs(currentZ - targetZ);

    let msg = `[正在扫描像素 ${activePt}] Z = ${currentZ} nm。`;
    if (diff < 5) {
      msg += ` ✨ 触发零光程差（ZPD）！已锁定绝对高度：${currentZ}nm。`;
      summaryText.style.color = 'var(--success-green)';
      summaryText.style.borderColor = 'var(--success-green)';
      summaryText.style.background = 'rgba(16, 185, 129, 0.1)';
    } else if (diff < coherenceLen * 1.5) {
      msg += ` ⚠️ 进入相干区域，捕获干涉条纹信号...`;
      summaryText.style.color = 'var(--accent-orange)';
      summaryText.style.borderColor = 'var(--accent-orange)';
      summaryText.style.background = 'rgba(251, 146, 60, 0.1)';
    } else {
      msg += ` ⚪ 处于非相干区，无干涉信号。`;
      summaryText.style.color = 'var(--text-muted)';
      summaryText.style.borderColor = 'var(--text-muted)';
      summaryText.style.background = 'rgba(0, 0, 0, 0.4)';
    }
    summaryText.innerText = msg;
  }

  function render() {
    const currentZ = parseInt(zSlider.value);
    zVal.innerText = currentZ;
    drawMech(currentZ);
    drawSignal(currentZ);
    updateText(currentZ);
  }

  zSlider.addEventListener('input', render);
  document.querySelectorAll('input[name="pixelSelect"]').forEach(radio => {
    radio.addEventListener('change', render);
  });

  render();
</script>

</body>
